# o11yag — action worker (tool-using agent): complete manifest set.
#
# Calls the CRM MCP server, and routes anything on CONSEQUENTIAL_TOOLS
# through the approval gate first.
# Apply with:  kubectl apply -f o11yag-action-worker.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11yag-action-worker-config
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-action-worker
    app.kubernetes.io/component: action-worker
    app.kubernetes.io/part-of: o11yag
data:
  SERVICE_NAME: "o11yag_action_worker"
  ENV: "production"
  PORT: "8002"
  WEB_CONCURRENCY: "2"
  GUNICORN_THREADS: "8"          # blocking waits are threads, not processes
  GUNICORN_TIMEOUT: "600"        # must outlast APPROVAL_TIMEOUT_S + the loop

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  TRACELOOP_TRACE_CONTENT: "false"

  LITELLM_URL: "http://litellm:4000/v1"
  CHAT_MODEL: "support-chat"

  MCP_URL: "http://o11yag-mcp-crm:8003/mcp"
  MCP_TIMEOUT_S: "60"

  APPROVALS_URL: "http://o11yag-approvals:8004"
  APPROVAL_TIMEOUT_S: "180"
  APPROVAL_POLL_S: "2"

  # Who picks the next tool call: "model" or "rules".
  #
  # qwen:0.5b is a poor tool-caller — measured over 3h of traffic it produced
  # usable arguments for lookup_order 2 times out of 51, and said "done" after
  # one step in 39 of 45 runs, so issue_refund was never reached and the
  # approval gate was never exercised.
  #
  # Set this to "rules" for a demo that must reach a consequential tool. Every
  # step it decides is tagged step.decided_by=fallback in the trace, so a
  # rules-driven run can never be mistaken for model reasoning.
  PLANNER_MODE: "model"

  # Loop budget. Lower it to make the "hit its budget and returned a partial
  # answer" case easy to produce on demand.
  MAX_STEPS: "4"
  CONSEQUENTIAL_TOOLS: "issue_refund"

  # --- gap 2: the security act ---
  # Expected fingerprint of the MCP tool catalogue (names, descriptions and
  # schemas). Empty means "trust the first catalogue this pod sees", which
  # catches a rug pull but not a server that was already poisoned at boot. The
  # digest is logged on first sight and is on the action_worker span as
  # mcp.tools.digest — copy it here to pin it.
  MCP_TOOLS_DIGEST: ""
  #   redact   blank a flagged tool description before the planner sees it
  #   observe  prompt with it anyway, to show the attack working
  TOOL_POISON_ACTION: "redact"
---
apiVersion: v1
kind: Service
metadata:
  name: o11yag-action-worker
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-action-worker
    app.kubernetes.io/component: action-worker
    app.kubernetes.io/part-of: o11yag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: o11yag-action-worker
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-action-worker
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-action-worker
    app.kubernetes.io/component: action-worker
    app.kubernetes.io/part-of: o11yag
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: o11yag-action-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o11yag-action-worker
        app.kubernetes.io/component: action-worker
        app.kubernetes.io/part-of: o11yag
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: action-worker
          image: o11yag-action-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: o11yag-action-worker-config
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Startup gate. timeoutSeconds is set EXPLICITLY because it defaults
          # to 1 second, and one second is not enough: Traceloop pulls in ~40
          # instrumentation packages and every gunicorn worker does that import
          # on boot, so /health cannot answer in time and the kubelet kills a
          # pod that was coming up perfectly well ("Startup probe failed:
          # context deadline exceeded"). 5s x 36 gives boot three minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          # Liveness runs against a process whose request threads block on slow
          # model calls and on the approval wait, so give /health room to answer
          # rather than restarting a pod that is merely busy. timeoutSeconds is
          # the wrong dial for that on its own — /health is trivial, it just has
          # to be scheduled — which is why the worker class is gthread. This
          # threshold is the second half of the same fix: 6 x 10s of silence
          # before a restart, comfortably past a single slow ticket.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # readOnlyRootFilesystem: gunicorn writes worker heartbeat files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
