# o11yag — approval gate (human-in-the-loop): complete manifest set.
#
# The reviewer page is at / — reach it with:
#   kubectl port-forward service/o11yag-approvals 8004:8004 -n o11yag-otel
# It only has anything to show when AUTO_APPROVE is false, or when a
# refund is over AUTO_APPROVE_MAX_EUR.
# Apply with:  kubectl apply -f o11yag-approvals.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11yag-approvals-config
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-approvals
    app.kubernetes.io/component: approvals
    app.kubernetes.io/part-of: o11yag
data:
  SERVICE_NAME: "o11yag_approvals"
  ENV: "production"
  PORT: "8004"
  WEB_CONCURRENCY: "2"
  GUNICORN_TIMEOUT: "60"

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  TRACELOOP_TRACE_CONTENT: "false"

  REDIS_URL: "redis://redis:6379/0"
  APPROVAL_TTL_S: "3600"

  # A simulated reviewer so loadgen runs unattended. Set to "false" for the
  # honest demo: the gate then waits for a person on the page at /.
  AUTO_APPROVE: "true"
  AUTO_APPROVE_AFTER_S: "8"
  # Above this amount nothing is ever auto-approved, so one path always stops
  # and waits for a human however this is configured.
  AUTO_APPROVE_MAX_EUR: "100"
---
apiVersion: v1
kind: Service
metadata:
  name: o11yag-approvals
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-approvals
    app.kubernetes.io/component: approvals
    app.kubernetes.io/part-of: o11yag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: o11yag-approvals
  ports:
    - name: http
      port: 8004
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-approvals
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-approvals
    app.kubernetes.io/component: approvals
    app.kubernetes.io/part-of: o11yag
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: o11yag-approvals
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o11yag-approvals
        app.kubernetes.io/component: approvals
        app.kubernetes.io/part-of: o11yag
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: approvals
          image: o11yag-approvals
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: o11yag-approvals-config
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Startup gate. timeoutSeconds is set EXPLICITLY because it defaults
          # to 1 second, and one second is not enough: Traceloop pulls in ~40
          # instrumentation packages and every gunicorn worker does that import
          # on boot, so /health cannot answer in time and the kubelet kills a
          # pod that was coming up perfectly well ("Startup probe failed:
          # context deadline exceeded"). 5s x 36 gives boot three minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          # Liveness runs against a process whose gunicorn workers block on slow
          # model calls, so give /health room to answer rather than restarting a
          # pod that is merely busy.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # readOnlyRootFilesystem: gunicorn writes worker heartbeat files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
