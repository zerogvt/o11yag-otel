# o11yag — OpenTelemetry Collector.
#
# Receives OTLP from every service (OpenLLMetry emits plain OTLP, so nothing
# here is Traceloop-specific) and forwards it to Dynatrace.
#
# BEFORE APPLYING: create the Dynatrace credential as a Secret. build_deploy.sh
# does this for you; by hand it is:
#
#   kubectl -n o11yag-otel create secret generic o11yag-collector \
#     --from-literal=DT_OTLP_ENDPOINT='https://<env-id>.live.dynatrace.com/api/v2/otlp' \
#     --from-literal=DT_API_TOKEN='dt0c01.XXXX.XXXX'
#
# Token scopes needed: Ingest metrics, Ingest OpenTelemetry traces, Ingest logs.
# (Ingest logs carries the audit records. Without it the Collector accepts them
# and Dynatrace rejects them, which is silent unless you read the debug output.)
#
# Changing the token means restarting this Deployment: the value below is read
# from the Secret at container start, so rewriting the Secret does not reach a
# running pod and the previous token stays in force. build_deploy.sh does the
# restart when it rewrites the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11yag-otel-collector-config
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: o11yag
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Guards against OOM under load; keep limit_mib below the container
      # memory limit (512Mi here) with headroom. Must run first in each pipeline.
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 5s
        send_batch_size: 1024
      # Dynatrace expects DELTA temporality for OTLP metrics; the SDK default is
      # CUMULATIVE. This converts it (and is why we use the contrib image).
      cumulativetodelta: {}

    exporters:
      otlphttp/dynatrace:
        endpoint: ${env:DT_OTLP_ENDPOINT}
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/dynatrace, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, cumulativetodelta, batch]
          exporters: [otlphttp/dynatrace, debug]
        # The audit records (conversation text, tool arguments, approval
        # decisions) arrive as OTLP *logs*, so this pipeline has to exist or
        # the whole record-keeping half of the stack is silently dropped here.
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/dynatrace, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-otel-collector
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: o11yag
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: o11yag-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o11yag-otel-collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: o11yag
      annotations:
        o11yag.config/revision: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          # contrib image includes cumulativetodelta. Pin a specific version
          # for reproducibility in real use.
          image: otel/opentelemetry-collector-contrib:latest
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otel/config.yaml"]
          envFrom:
            - secretRef:
                name: o11yag-collector
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: o11yag-otel-collector-config
---
# Named "otel-collector" to match the OTEL_EXPORTER_OTLP_ENDPOINT every service
# ConfigMap points at (http://otel-collector:4318).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: o11yag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: o11yag-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
