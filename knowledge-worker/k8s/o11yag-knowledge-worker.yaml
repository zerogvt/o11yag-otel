# o11yag — knowledge worker (RAG over the support KB): complete manifest set.
# Seeds its own Qdrant collection on first boot; there is no separate seed Job.
# Apply with:  kubectl apply -f o11yag-knowledge-worker.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11yag-knowledge-worker-config
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-knowledge-worker
    app.kubernetes.io/component: knowledge-worker
    app.kubernetes.io/part-of: o11yag
data:
  SERVICE_NAME: "o11yag_knowledge_worker"
  ENV: "production"
  PORT: "8001"
  WEB_CONCURRENCY: "2"
  GUNICORN_TIMEOUT: "300"

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  TRACELOOP_TRACE_CONTENT: "false"

  LITELLM_URL: "http://litellm:4000/v1"
  CHAT_MODEL: "support-chat"
  EMBED_MODEL: "support-embed"

  QDRANT_URL: "http://qdrant:6333"
  COLLECTION: "support_kb"
  EMBED_DIM: "768"               # nomic-embed-text; change both together
  TOP_K: "3"
  # Best-match score below which we refuse to answer rather than let the model
  # invent a policy. Tune it against the o11yag.retrieval.top_score histogram.
  MIN_SCORE: "0.3"

  # --- gap 1: the quality signal ---
  # Grading of answers that WERE given. MIN_SCORE above only catches answers
  # that should not have been attempted; this catches the ones grounded in the
  # right document and wrong anyway.
  #   off | heuristic | model   (model = deterministic checks, then a judge call)
  #
  # Measured on this stack: over 10 graded answers the judge model returned 0
  # usable verdicts for 2,353 tokens and 1,462ms p50 of added latency. Set this
  # to "heuristic" to stop paying for that; leave it on "model" to keep the
  # failure visible in quality.decided_by, which is where it was found.
  JUDGE_MODE: "model"
  # Its own gateway alias so the judge can be swapped for a capable model
  # without touching code. Today it resolves to the same qwen:0.5b as
  # CHAT_MODEL, and a judge no better than the thing it grades is worth
  # exactly what that sounds like — see the note in the README.
  JUDGE_MODEL: "support-judge"
  JUDGE_MAX_TOKENS: "60"
  # Share of the answer's content words that must appear in the extracts.
  # Raise it and honest paraphrase gets flagged; lower it and only the
  # invented-number check does any work. Tune against o11yag.answer.quality
  # filtered to decided_by=heuristic.
  JUDGE_MIN_OVERLAP: "0.35"
  #   observe   record the verdict, still send the answer
  #   withhold  replace an unsupported answer with the refusal
  JUDGE_ACTION: "observe"

  # --- gap 2: the security act ---
  # Seed the indirect-prompt-injection document into the corpus. The collection
  # is reseeded when this changes, because Qdrant's volume outlives the pod and
  # a flag that silently does nothing is worse than no flag.
  KB_POISON_DOC: "true"
  #   quarantine  drop a flagged document before it reaches the prompt
  #   observe     let the injection through, to show what it does unopposed
  INJECTION_ACTION: "quarantine"
---
apiVersion: v1
kind: Service
metadata:
  name: o11yag-knowledge-worker
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-knowledge-worker
    app.kubernetes.io/component: knowledge-worker
    app.kubernetes.io/part-of: o11yag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: o11yag-knowledge-worker
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-knowledge-worker
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-knowledge-worker
    app.kubernetes.io/component: knowledge-worker
    app.kubernetes.io/part-of: o11yag
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: o11yag-knowledge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o11yag-knowledge-worker
        app.kubernetes.io/component: knowledge-worker
        app.kubernetes.io/part-of: o11yag
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge-worker
          image: o11yag-knowledge-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: o11yag-knowledge-worker-config
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Startup gate. timeoutSeconds is set EXPLICITLY because it defaults
          # to 1 second, and one second is not enough: Traceloop pulls in ~40
          # instrumentation packages and every gunicorn worker does that import
          # on boot, so /health cannot answer in time and the kubelet kills a
          # pod that was coming up perfectly well ("Startup probe failed:
          # context deadline exceeded"). 5s x 36 gives boot three minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          # Liveness runs against a process whose gunicorn workers block on slow
          # model calls, so give /health room to answer rather than restarting a
          # pod that is merely busy.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # readOnlyRootFilesystem: gunicorn writes worker heartbeat files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
