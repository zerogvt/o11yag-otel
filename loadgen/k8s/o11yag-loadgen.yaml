# o11yag — load generator: complete manifest set.
#
# Emits no telemetry of its own; it only makes the rest of the stack produce
# some. Watch what it is doing with:
#   kubectl logs -l app.kubernetes.io/name=o11yag-loadgen -n o11yag-otel -f
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11yag-loadgen-config
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-loadgen
    app.kubernetes.io/component: loadgen
    app.kubernetes.io/part-of: o11yag
data:
  ORCHESTRATOR_URL: "http://o11yag-orchestrator:8000"
  # One ticket every 20s. A CPU-only 0.5B model serializes generation, so a
  # faster rate just queues up behind Ollama and tells you nothing new.
  INTERVAL_S: "20"
  TIMEOUT_S: "420"
  TENANT: "acme"
  LOG_RESPONSES: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-loadgen
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-loadgen
    app.kubernetes.io/component: loadgen
    app.kubernetes.io/part-of: o11yag
spec:
  # Scale to 0 to stop the traffic without deleting anything:
  #   kubectl scale deploy/o11yag-loadgen --replicas=0 -n o11yag-otel
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: o11yag-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o11yag-loadgen
        app.kubernetes.io/component: loadgen
        app.kubernetes.io/part-of: o11yag
    spec:
      # Long enough for an in-flight ticket (which may be sitting behind a human
      # approval) to come back before the pod is killed.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: o11yag-loadgen
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: o11yag-loadgen-config
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
