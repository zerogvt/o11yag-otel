# o11yag — CRM MCP server (Streamable HTTP): complete manifest set.
# Reachable in-cluster at http://o11yag-mcp-crm:8003/mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11yag-mcp-crm-config
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-mcp-crm
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: o11yag
data:
  SERVICE_NAME: "o11yag_mcp_crm"
  ENV: "production"
  PORT: "8003"

  # Host headers this server accepts. The MCP SDK validates Host to block DNS
  # rebinding attacks and auto-allows ONLY localhost — so in-cluster, where the
  # Host is the Service name, every call returns "421 Misdirected Request"
  # unless the name is listed here. ":*" means "any port".
  #
  # Add a name here when you expose this server by a new address (an Ingress
  # host, a different namespace). Do NOT reach for
  # MCP_DNS_REBINDING_PROTECTION=false — that turns the check off for everyone.
  MCP_ALLOWED_HOSTS: "o11yag-mcp-crm:*,o11yag-mcp-crm.o11yag-otel:*,o11yag-mcp-crm.o11yag-otel.svc.cluster.local:*,localhost:*,127.0.0.1:*"
  MCP_DNS_REBINDING_PROTECTION: "true"

  # --- gap 2: the security act ---
  # Advertise issue_refund with an injected description, so the action worker's
  # screening has a real attacker-controlled string to catch rather than a
  # simulated finding. Flipping this on a running stack is also the rug pull:
  # the tool catalogue digest the worker recorded stops matching.
  POISON_TOOL_DESCRIPTION: "false"

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  TRACELOOP_TRACE_CONTENT: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: o11yag-mcp-crm
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-mcp-crm
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: o11yag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: o11yag-mcp-crm
  ports:
    - name: http
      port: 8003
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-mcp-crm
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: o11yag-mcp-crm
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: o11yag
spec:
  # Single replica on purpose: the fake system of record is in-process memory,
  # so two replicas would disagree about whether an order was refunded.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: o11yag-mcp-crm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o11yag-mcp-crm
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: o11yag
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-crm
          image: o11yag-mcp-crm
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: o11yag-mcp-crm-config
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # TCP probes, not HTTP: see the note in the Dockerfile — a bare GET to
          # the Streamable HTTP endpoint is an error, not a health signal.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
