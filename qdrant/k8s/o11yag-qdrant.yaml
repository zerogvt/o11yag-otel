# o11yag — Qdrant, the vector store the knowledge worker retrieves from.
#
# Seeded on startup by the knowledge worker itself (see knowledge-worker/seed.py):
# the collection is created and filled on first boot if it is missing, so there
# is no separate seed Job to run or forget.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: o11yag-qdrant-storage
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: o11yag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: o11yag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o11yag-qdrant
  namespace: o11yag-otel
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: o11yag
spec:
  replicas: 1
  # ReadWriteOnce PVC: only one pod may mount it, so tear the old one down
  # before starting the new one (same reason as Ollama below).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/component: vector-store
        app.kubernetes.io/part-of: o11yag
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: o11yag-qdrant-storage
